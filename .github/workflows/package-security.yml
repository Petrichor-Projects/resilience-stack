name: Package Security

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-security.yml"
      - "bin/**"
      - "install.sh"
      - "package.json"
      - "README.md"
      - "test/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/package-security.yml"
      - "bin/**"
      - "install.sh"
      - "package.json"
      - "README.md"
      - "test/**"

permissions:
  contents: read

jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run installer tests
        run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Verify local bulk installer
        env:
          RESILIENCE_STACK_SKILLS_DIR: ${{ runner.temp }}/resilience-skills
        run: |
          ./install.sh
          test "$(find "$RESILIENCE_STACK_SKILLS_DIR" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 18
